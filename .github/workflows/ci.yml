name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JSON files parse
        run: jq empty .claude-plugin/*.json skills/setup/templates/*.json tests/*.json

      - name: Status line script passes shellcheck
        run: shellcheck skills/setup/scripts/statusline.sh

      # tests/statusline-input.json is a sample of what Claude Code sends a status line command.
      - name: Status line saves usage data
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/with-limits
        run: |
          out=$(bash skills/setup/scripts/statusline.sh < tests/statusline-input.json)
          echo "$out"
          jq -e '.rate_limits.seven_day.resets_at == 1790265600 and .rate_limits.five_hour.used_percentage == 12' \
            "$CLAUDE_CONFIG_DIR/moonlight/usage.json"
          grep -q '7d 41%' <<<"$out"

      - name: Status line without usage data saves nothing
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/no-limits
        run: |
          out=$(jq 'del(.rate_limits)' tests/statusline-input.json | bash skills/setup/scripts/statusline.sh)
          echo "$out"
          test -n "$out"
          test ! -e "$CLAUDE_CONFIG_DIR/moonlight/usage.json"

      - name: Status line hands its input to the previous status line
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/chained
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR/moonlight"
          printf '%s' 'jq -r .model.display_name' > "$CLAUDE_CONFIG_DIR/moonlight/chain"
          out=$(bash skills/setup/scripts/statusline.sh < tests/statusline-input.json)
          test "$out" = "Test Model"
          test -e "$CLAUDE_CONFIG_DIR/moonlight/usage.json"

      # The template is the shape setup copies, so its UTC times must stay in step
      # with its local ones. Which season the example assumes doesn't matter, only
      # that both offsets agree: a typo in one of the four times breaks that.
      - name: Config template's UTC times match its local ones
        run: |
          python3 - <<'EOF'
          import json
          days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
          cfg = json.load(open("skills/setup/templates/moonlight.json"))

          def minutes(label):
              day, clock = label.split()
              hh, mm = clock.split(":")
              return days.index(day) * 1440 + int(hh) * 60 + int(mm)

          pairs = (("weekly_reset", "reset_utc"), ("stop_at", "stop_at_utc"))
          offsets = {
              utc: (minutes(cfg[utc]) - minutes(cfg[local])) % (7 * 1440)
              for local, utc in pairs
          }
          assert len(set(offsets.values())) == 1, offsets
          assert all(o % 15 == 0 for o in offsets.values()), offsets  # no zone is off by stray minutes
          print("offsets agree:", offsets)
          EOF

      # A moved weekly reset is the one thing the routine can't see for itself, so it
      # has to reach the status line - including the hand-off to a previous status line.
      - name: Status line warns when the weekly reset has moved
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/moved-reset
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR/moonlight"
          plan() { printf '{"reset_utc":"%s"}' "$1" > "$CLAUDE_CONFIG_DIR/moonlight/config.json"; }
          quiet() { if line | grep -q 'reset moved'; then line; echo "unexpected warning"; exit 1; fi; }
          loud() { if ! line | grep -q 'reset moved'; then line; echo "missing warning"; exit 1; fi; }

          # The fixture's resets_at is Thu 16:00 UTC.
          line() { bash skills/setup/scripts/statusline.sh < tests/statusline-input.json; }
          plan "Thu 16:00" && quiet                 # the planned reset
          plan "Thu 16:20" && quiet                 # within the 30-minute tolerance
          plan "Thu 13:00" && loud                  # moved by hours
          plan "Wed 16:00" && loud                  # moved by a day
          rm "$CLAUDE_CONFIG_DIR/moonlight/config.json" && quiet   # no plan to compare with

          # 1791157800 is Sun 23:50 UTC: a small gap across the Sunday/Monday wrap
          # must not read as most of a week apart.
          jq '.rate_limits.seven_day.resets_at = 1791157800' tests/statusline-input.json > "$CLAUDE_CONFIG_DIR/wrap.json"
          line() { bash skills/setup/scripts/statusline.sh < "$CLAUDE_CONFIG_DIR/wrap.json"; }
          plan "Mon 00:10" && quiet
          plan "Mon 01:00" && loud

          # The warning still shows when another status line command takes over.
          printf '%s' 'jq -r .model.display_name' > "$CLAUDE_CONFIG_DIR/moonlight/chain"
          plan "Mon 01:00" && loud
          test "$(line)" = "Test Model ⚠ reset moved, run /moonlight:status"
